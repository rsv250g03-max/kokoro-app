<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ココロノケシキ | 写真から気持ちを言語化するアプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      background-color: #f8fafc;
    }
    .serif-title {
      font-family: 'Shippori Mincho', serif;
    }
    .gradient-bg {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 pb-12">

  <!-- ヘッダー -->
  <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full gradient-bg flex items-center justify-center text-amber-300">
          <i class="fa-solid fa-camera-retro text-sm"></i>
        </div>
        <h1 class="serif-title font-bold text-lg tracking-wide text-slate-900">ココロノケシキ</h1>
      </div>
      <button id="apiKeyBtn" class="text-xs px-3 py-1.5 rounded-full border border-slate-300 text-slate-600 hover:bg-slate-100 flex items-center gap-1.5 transition">
        <i class="fa-solid fa-key text-amber-500"></i>
        <span id="keyStatusText">APIキー設定</span>
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-4 space-y-6">

    <!-- APIキー設定モーダル -->
    <div id="apiModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="font-bold text-slate-900 flex items-center gap-2">
            <i class="fa-solid fa-key text-amber-500"></i> Gemini APIキー
          </h3>
          <button id="closeModal" class="text-slate-400 hover:text-slate-600">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>
        <p class="text-xs text-slate-500 leading-relaxed">
          Google AI Studioで取得したAPIキーを入力してください。<br>キーはブラウザにのみ安全に保存されます。
        </p>
        <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
        <div class="flex justify-end gap-2 pt-2">
          <button id="saveApiKey" class="w-full py-2.5 bg-slate-900 text-white rounded-lg text-sm font-medium hover:bg-slate-800 transition">
            保存する
          </button>
        </div>
      </div>
    </div>

    <!-- 写真アップロードエリア -->
    <section class="space-y-2">
      <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">1. 写真を選ぶ</label>
      <div id="dropZone" class="relative border-2 border-dashed border-slate-300 hover:border-amber-500 rounded-2xl bg-white p-6 text-center cursor-pointer transition flex flex-col items-center justify-center min-h-[220px] overflow-hidden group">
        <input type="file" id="imageInput" accept="image/*" class="hidden">
        
        <div id="uploadPrompt" class="space-y-3">
          <div class="w-14 h-14 bg-amber-50 rounded-full flex items-center justify-center text-amber-600 mx-auto group-hover:scale-110 transition">
            <i class="fa-solid fa-image text-2xl"></i>
          </div>
          <div>
            <p class="text-sm font-medium text-slate-700">タップして写真を選択</p>
            <p class="text-xs text-slate-400 mt-1">風景や気になった瞬間の写真</p>
          </div>
        </div>

        <img id="imagePreview" class="hidden absolute inset-0 w-full h-full object-cover rounded-2xl">
        <button id="changeImgBtn" class="hidden absolute top-3 right-3 bg-slate-900/80 text-white px-2.5 py-1 rounded-full text-xs backdrop-blur-md hover:bg-slate-900">
          <i class="fa-solid fa-rotate-right mr-1"></i> 変更
        </button>
      </div>
    </section>

    <!-- トーン選択 -->
    <section class="space-y-2">
      <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">2. 言葉のトーン（雰囲気）</label>
      <div class="grid grid-cols-2 gap-2">
        <button type="button" class="tone-btn active p-3 rounded-xl border border-amber-500 bg-amber-50/50 text-left transition flex items-start gap-2.5" data-tone="emotional">
          <span class="text-lg">🌿</span>
          <div>
            <p class="text-xs font-bold text-slate-800">エモい・詩的</p>
            <p class="text-[10px] text-slate-500">余韻と情緒のある言葉</p>
          </div>
        </button>
        <button type="button" class="tone-btn p-3 rounded-xl border border-slate-200 bg-white text-left transition flex items-start gap-2.5 hover:border-slate-300" data-tone="retro">
          <span class="text-lg">☕</span>
          <div>
            <p class="text-xs font-bold text-slate-800">レトロ・昭和風</p>
            <p class="text-[10px] text-slate-500">どこか懐かしいノスタルジー</p>
          </div>
        </button>
        <button type="button" class="tone-btn p-3 rounded-xl border border-slate-200 bg-white text-left transition flex items-start gap-2.5 hover:border-slate-300" data-tone="gentle">
          <span class="text-lg">☁️</span>
          <div>
            <p class="text-xs font-bold text-slate-800">心に寄り添う</p>
            <p class="text-[10px] text-slate-500">温かい労いと問いかけ</p>
          </div>
        </button>
        <button type="button" class="tone-btn p-3 rounded-xl border border-slate-200 bg-white text-left transition flex items-start gap-2.5 hover:border-slate-300" data-tone="blog">
          <span class="text-lg">📝</span>
          <div>
            <p class="text-xs font-bold text-slate-800">ブログ・メモ用</p>
            <p class="text-[10px] text-slate-500">思考を深める言語化練習</p>
          </div>
        </button>
      </div>
    </section>

    <!-- 生成実行ボタン -->
    <button id="generateBtn" disabled class="w-full py-3.5 px-4 bg-slate-300 text-slate-500 rounded-xl font-bold text-sm shadow-sm transition flex items-center justify-center gap-2 cursor-not-allowed">
      <i class="fa-solid fa-wand-magic-sparkles"></i>
      <span>写真を言葉にする</span>
    </button>

    <!-- ローディング表示 -->
    <div id="loading" class="hidden py-8 text-center space-y-3">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-amber-500 border-t-transparent"></div>
      <p class="text-xs text-slate-500 font-medium">景色から感情を読み解いています...</p>
    </div>

    <!-- 結果表示エリア -->
    <section id="resultSection" class="hidden space-y-4">
      <div class="border-t border-slate-200 pt-4 flex items-center justify-between">
        <h2 class="serif-title font-bold text-slate-900 text-base">紡がれた言葉</h2>
        <span class="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-medium" id="usedToneTag">エモい・詩的</span>
      </div>

      <!-- 出力カード1: キャプション -->
      <div class="bg-white rounded-xl p-4 border border-slate-200 space-y-2 shadow-sm">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1">
            <i class="fa-solid fa-quote-left text-amber-500"></i> 一言キャプション
          </span>
          <button class="copy-btn text-xs text-slate-500 hover:text-amber-600 transition flex items-center gap-1" data-target="captionText">
            <i class="fa-regular fa-copy"></i> コピー
          </button>
        </div>
        <p id="captionText" class="serif-title text-base font-semibold text-slate-800 leading-relaxed pt-1"></p>
      </div>

      <!-- 出力カード2: ブログ・日記用 -->
      <div class="bg-white rounded-xl p-4 border border-slate-200 space-y-2 shadow-sm">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1">
            <i class="fa-solid fa-pen-nib text-amber-500"></i> 心と言葉の整理（ブログ・日記用）
          </span>
          <button class="copy-btn text-xs text-slate-500 hover:text-amber-600 transition flex items-center gap-1" data-target="blogText">
            <i class="fa-regular fa-copy"></i> コピー
          </button>
        </div>
        <p id="blogText" class="text-xs text-slate-600 leading-relaxed whitespace-pre-line pt-1"></p>
      </div>

      <!-- 出力カード3: 自分への問いかけ -->
      <div class="bg-amber-50/60 rounded-xl p-4 border border-amber-200 space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-bold text-amber-800 uppercase tracking-wider flex items-center gap-1">
            <i class="fa-solid fa-seedling"></i> 心への問いかけ
          </span>
          <button class="copy-btn text-xs text-amber-800/70 hover:text-amber-900 transition flex items-center gap-1" data-target="questionText">
            <i class="fa-regular fa-copy"></i> コピー
          </button>
        </div>
        <p id="questionText" class="text-xs text-amber-950 font-medium leading-relaxed pt-1"></p>
      </div>

      <!-- カード画像作成・保存ボタン -->
      <div class="pt-2">
        <button id="makeCardBtn" class="w-full py-3 bg-white border border-slate-300 text-slate-700 rounded-xl font-bold text-xs shadow-sm hover:bg-slate-50 transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-download text-amber-500"></i>
          <span>写真カード画像を生成して保存</span>
        </button>
      </div>
    </section>

    <!-- 隠しCanvas (カード生成用) -->
    <canvas id="cardCanvas" class="hidden"></canvas>

  </main>

  <script>
    // 状態管理
    let apiKey = localStorage.getItem('gemini_api_key') || '';
    let selectedTone = 'emotional';
    let currentBase64Image = null;

    // DOM要素
    const apiKeyBtn = document.getElementById('apiKeyBtn');
    const apiModal = document.getElementById('apiModal');
    const closeModal = document.getElementById('closeModal');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveApiKey = document.getElementById('saveApiKey');
    const keyStatusText = document.getElementById('keyStatusText');

    const dropZone = document.getElementById('dropZone');
    const imageInput = document.getElementById('imageInput');
    const uploadPrompt = document.getElementById('uploadPrompt');
    const imagePreview = document.getElementById('imagePreview');
    const changeImgBtn = document.getElementById('changeImgBtn');

    const toneBtns = document.querySelectorAll('.tone-btn');
    const generateBtn = document.getElementById('generateBtn');
    const loading = document.getElementById('loading');
    const resultSection = document.getElementById('resultSection');

    const captionText = document.getElementById('captionText');
    const blogText = document.getElementById('blogText');
    const questionText = document.getElementById('questionText');
    const usedToneTag = document.getElementById('usedToneTag');
    const makeCardBtn = document.getElementById('makeCardBtn');

    // 初期化表示
    updateKeyStatus();

    function updateKeyStatus() {
      if (apiKey) {
        keyStatusText.textContent = 'APIキー設定済';
        keyStatusText.classList.add('text-emerald-600');
      } else {
        keyStatusText.textContent = 'APIキー未設定';
        keyStatusText.classList.remove('text-emerald-600');
      }
      checkReady();
    }

    // モーダルイベント
    apiKeyBtn.addEventListener('click', () => {
      apiKeyInput.value = apiKey;
      apiModal.classList.remove('hidden');
    });
    closeModal.addEventListener('click', () => apiModal.classList.add('hidden'));
    saveApiKey.addEventListener('click', () => {
      apiKey = apiKeyInput.value.trim();
      localStorage.setItem('gemini_api_key', apiKey);
      apiModal.classList.add('hidden');
      updateKeyStatus();
    });

    // 画像選択イベント
    dropZone.addEventListener('click', () => imageInput.click());
    changeImgBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      imageInput.click();
    });

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        currentBase64Image = evt.target.result;
        imagePreview.src = currentBase64Image;
        imagePreview.classList.remove('hidden');
        changeImgBtn.classList.remove('hidden');
        uploadPrompt.classList.add('hidden');
        checkReady();
      };
      reader.readAsDataURL(file);
    });

    // トーン選択
    toneBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        toneBtns.forEach(b => {
          b.classList.remove('active', 'border-amber-500', 'bg-amber-50/50');
          b.classList.add('border-slate-200', 'bg-white');
        });
        btn.classList.add('active', 'border-amber-500', 'bg-amber-50/50');
        btn.classList.remove('border-slate-200', 'bg-white');
        selectedTone = btn.dataset.tone;
      });
    });

    // 準備OKか確認
    function checkReady() {
      if (apiKey && currentBase64Image) {
        generateBtn.disabled = false;
        generateBtn.classList.remove('bg-slate-300', 'text-slate-500', 'cursor-not-allowed');
        generateBtn.classList.add('gradient-bg', 'text-white', 'shadow-md', 'hover:opacity-95', 'cursor-pointer');
      } else {
        generateBtn.disabled = true;
        generateBtn.classList.add('bg-slate-300', 'text-slate-500', 'cursor-not-allowed');
        generateBtn.classList.remove('gradient-bg', 'text-white', 'shadow-md', 'hover:opacity-95', 'cursor-pointer');
      }
    }

    // 生成処理
    generateBtn.addEventListener('click', async () => {
      if (!apiKey) {
        alert('APIキーを設定してください');
        apiModal.classList.remove('hidden');
        return;
      }

      loading.classList.remove('hidden');
      resultSection.classList.add('hidden');

      const tonePrompts = {
        emotional: "余韻があり、詩的で少し切なく美しい「エモい」トーン",
        retro: "昭和レトロ、喫茶店、ノスタルジックでどこか懐かしいトーン",
        gentle: "優しく温かく、見る人の心に寄り添い労うトーン",
        blog: "自分の感情や思考を言語化する練習用の、客観的かつ深掘りしやすいトーン"
      };

      const promptText = `
あなたはプロの文章家・写真評論家です。送られた風景の写真から、色合い、光の入り方、写っているものを深く観察し、以下の3つの要素をJSON形式で返してください。

トーン指定: ${tonePrompts[selectedTone]}

【出力フォーマット（必ず厳格なJSONのみ）】
{
  "caption": "写真に添える短い1言キャプション（15〜25文字程度）",
  "blog": "写真の情景とそこから感じられる感情や思考の整理文章。ブログや日記に使える短文（120〜180文字程度）",
  "question": "この景色を見たユーザー自身の気持ちをさらに引き出すための自分への問いかけ（1問）"
}
`;

      try {
        const base64Data = currentBase64Image.split(',')[1];
        const mimeType = currentBase64Image.split(',')[0].split(':')[1].split(';')[0];

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/​gemini-3.8-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                {
                  inline_data: {
                    mime_type: mimeType,
                    data: base64Data
                  }
                }
              ]
            }],
            generationConfig: {
              response_mime_type: "application/json"
            }
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const resultJson = JSON.parse(data.candidates[0].content.parts[0].text);

        captionText.textContent = resultJson.caption;
        blogText.textContent = resultJson.blog;
        questionText.textContent = resultJson.question;

        const toneLabels = {
          emotional: 'エモい・詩的',
          retro: 'レトロ・昭和風',
          gentle: '心に寄り添う',
          blog: 'ブログ・メモ用'
        };
        usedToneTag.textContent = toneLabels[selectedTone];

        resultSection.classList.remove('hidden');
        resultSection.scrollIntoView({ behavior: 'smooth' });

      } catch (err) {
        alert('言語化に失敗しました: ' + err.message);
      } finally {
        loading.classList.add('hidden');
      }
    });

    // コピーボタン処理
    document.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetId = btn.dataset.target;
        const text = document.getElementById(targetId).textContent;
        navigator.clipboard.writeText(text).then(() => {
          const originalHTML = btn.innerHTML;
          btn.innerHTML = `<i class="fa-solid fa-check text-emerald-500"></i> 完了!`;
          setTimeout(() => btn.innerHTML = originalHTML, 2000);
        });
      });
    });

    // カード画像描画・保存処理
    makeCardBtn.addEventListener('click', () => {
      const canvas = document.getElementById('cardCanvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();

      img.onload = () => {
        // カードの解像度
        canvas.width = 1080;
        canvas.height = 1350;

        // 背景
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 写真の描画（中央、上部）
        const imgAspect = img.width / img.height;
        let drawW = 920;
        let drawH = drawW / imgAspect;
        if (drawH > 800) {
          drawH = 800;
          drawW = drawH * imgAspect;
        }
        const imgX = (canvas.width - drawW) / 2;
        const imgY = 80;

        ctx.drawImage(img, imgX, imgY, drawW, drawH);

        // キャプション描画
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 36px "Shippori Mincho", serif';
        ctx.textAlign = 'center';
        
        const text = captionText.textContent;
        ctx.fillText(text, canvas.width / 2, imgY + drawH + 120);

        // アプリ名ロゴ
        ctx.fillStyle = '#94a3b8';
        ctx.font = '24px "Zen Kaku Gothic New", sans-serif';
        ctx.fillText('— ココロノケシキ PhotoFeel —', canvas.width / 2, canvas.height - 80);

        // 画像ダウンロード
        const link = document.createElement('a');
        link.download = 'kokoro-no-keshiki.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      };
      img.src = currentBase64Image;
    });
  </script>
</body>
</html>
